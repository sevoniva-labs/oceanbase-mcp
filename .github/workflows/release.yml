name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本，例如 v1.1.2"
        required: true
        type: string
      prerelease:
        description: "是否标记为预发布"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/sevoniva/oceanbase-mcp

jobs:
  metadata:
    name: 准备发布信息
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: 解析版本
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "版本必须是 vX.Y.Z，例如 v1.1.2" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  tag:
    name: 创建 Tag
    needs: metadata
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: 创建并推送 tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ needs.metadata.outputs.tag }}" >/dev/null 2>&1; then
            echo "tag 已存在：${{ needs.metadata.outputs.tag }}"
          else
            git tag -a "${{ needs.metadata.outputs.tag }}" -m "Release ${{ needs.metadata.outputs.tag }}"
            git push origin "${{ needs.metadata.outputs.tag }}"
          fi

  package:
    name: 构建 npm 包
    needs:
      - metadata
      - tag
    if: always() && needs.metadata.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 测试
        run: npm test

      - name: 生成 SBOM
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom.cdx.json

      - name: 打包源码
        run: git archive --format=tar.gz --prefix=ob-mcp-${{ needs.metadata.outputs.version }}/ HEAD -o ob-mcp-${{ needs.metadata.outputs.version }}-source.tar.gz

      - name: 打包
        run: npm pack

      - name: 上传 npm 包产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: |
            *.tgz
            sbom.cdx.json
            ob-mcp-*-source.tar.gz
          if-no-files-found: error

  image:
    name: 推送多架构镜像
    needs:
      - metadata
      - tag
      - package
    if: always() && needs.metadata.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') && needs.package.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.metadata.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ needs.metadata.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=OceanBase MCP
            org.opencontainers.image.description=Read-only MCP gateway for OceanBase
            org.opencontainers.image.source=https://github.com/sevoniva/oceanbase-mcp
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}

  offline-images:
    name: 构建离线镜像
    needs:
      - metadata
      - tag
      - package
    if: always() && needs.metadata.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') && needs.package.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 构建离线镜像 tar
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=docker,dest=/tmp/oceanbase-mcp-${{ needs.metadata.outputs.version }}-${{ matrix.arch }}.tar
          tags: oceanbase-mcp:${{ needs.metadata.outputs.version }}-${{ matrix.arch }}

      - name: 压缩离线镜像
        run: gzip -9 /tmp/oceanbase-mcp-${{ needs.metadata.outputs.version }}-${{ matrix.arch }}.tar

      - name: 上传离线镜像产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-image-${{ matrix.arch }}
          path: /tmp/oceanbase-mcp-${{ needs.metadata.outputs.version }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  github-release:
    name: 创建 GitHub Release
    needs:
      - metadata
      - package
      - image
      - offline-images
    if: always() && needs.metadata.result == 'success' && needs.package.result == 'success' && needs.image.result == 'success' && needs.offline-images.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 下载 npm 包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: dist-release

      - name: 下载 amd64 离线镜像
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: offline-image-amd64
          path: dist-release

      - name: 下载 arm64 离线镜像
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: offline-image-arm64
          path: dist-release

      - name: 写入发布说明
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## OceanBase MCP ${{ needs.metadata.outputs.tag }}

          This release improves local OpenCode query stability for OceanBase MCP. It raises the default local HTTP rate limit for tool-heavy workflows, adds crash and slow-call logs, and accepts common Oracle named bind placeholders when positional params are supplied. The server remains strictly read-only.

          ## 新增能力

          - 本地 HTTP 默认限流从每分钟 60 次调整为 600 次，适配 OpenCode 连续元数据查询、预览和分页调用。
          - 生产环境或非本地绑定仍默认每分钟 60 次，保持共享部署的保守边界。
          - `OB_MCP_LOG_FILE` 支持 JSONL 日志落盘，便于排查 stdio 场景下的 OpenCode 断连。
          - 新增进程级崩溃日志、慢工具调用日志、慢 HTTP 请求日志、HTTP 限流日志和 JSON body 错误日志。
          - Oracle 模式在传入 `params` 数组时兼容简单 `:name` 和 `:1` 占位符，执行前转换为驱动可识别的参数形式。
          - 占位符转换会跳过字符串、标识符和注释，避免改写 SQL 文本内容。
          - SQL 辅助文档补充 Oracle 参数化写法，仍建议生成 MCP 调用时优先使用 `?` 位置占位符。
          - 只读策略、profile 权限、行数限制、输出大小限制、超时、审计日志和错误脱敏保持不变。

          ## Delivery Assets

          - `ob-mcp-${{ needs.metadata.outputs.version }}-source.tar.gz`：源码归档，用于内网编译。
          - `ob-mcp-${{ needs.metadata.outputs.version }}.tgz`：npm package。
          - `sbom.cdx.json`：CycloneDX SBOM。
          - `oceanbase-mcp-${{ needs.metadata.outputs.version }}-amd64.tar.gz`：amd64 离线镜像。
          - `oceanbase-mcp-${{ needs.metadata.outputs.version }}-arm64.tar.gz`：arm64 离线镜像。
          - `ghcr.io/sevoniva/oceanbase-mcp:${{ needs.metadata.outputs.tag }}`
          - `ghcr.io/sevoniva/oceanbase-mcp:${{ needs.metadata.outputs.version }}`

          ## 内网源码编译

          ```bash
          tar -xzf ob-mcp-${{ needs.metadata.outputs.version }}-source.tar.gz
          cd ob-mcp-${{ needs.metadata.outputs.version }}
          npm ci
          npm run build
          npm run start
          ```

          源码归档不包含 `node_modules` 和 `dist`。内网 npm 制品库需要能提供 `package-lock.json` 中锁定的依赖。

          ## 验证要求

          - OceanBase MySQL 模式 smoke test 和连续查询压测通过。
          - OceanBase Oracle 模式 smoke test、命名占位符查询预览和连续查询压测通过。
          - 本地 HTTP 连续调用压测通过，未触发默认限流。
          - JSONL 日志落盘和敏感字段脱敏单元测试通过。
          - `npm test`、`npm run docs:check`、`npm audit --omit=dev --audit-level=moderate`、`npm pack --dry-run`、Docker build 通过。

          ## 生产注意事项

          - 建议数据库账号仍使用只读权限；MCP 会继续拦截写入、DDL、DCL、过程调用和序列 `NEXTVAL`。
          - 本地排查 OpenCode 断连时建议配置 `OB_MCP_LOG_FILE=/var/log/ob-mcp/ob-mcp.jsonl`。
          - 本地 OpenCode 推荐使用 stdio；如使用 HTTP，本地默认限流为 600 次/分钟，可通过 `OB_MCP_RATE_LIMIT_MAX` 显式调整。
          - 生产或非本地 HTTP 绑定必须配置鉴权、Host allowlist 和来源 IP allowlist。
          - Oracle 模式生成新 SQL 时仍优先使用 `?` 位置占位符，避免重复命名参数带来的歧义。
          - OpenCode 使用前建议先加载随包提供的 Agent/Skill 配置。
          EOF

      - name: 创建 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: OceanBase MCP ${{ needs.metadata.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == true }}
          files: |
            dist-release/*.tgz
            dist-release/*.json
            dist-release/*.tar.gz
